# Owner-registered Light House identity. Preserve app.id across environments.
modules:
  jira:globalPage:
    - key: light-house-global-page
      resource: light-house-ui
      resolver:
        function: status-resolver
      title: Light House
  function:
    - key: status-resolver
      handler: index.handler
resources:
  - key: light-house-ui
    path: dist/ui
permissions:
  scopes: []
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/1ef4af03-f1ed-4498-a83e-1a8978cf5430
